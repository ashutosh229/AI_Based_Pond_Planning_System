x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:
  backend:
    build: *backend-build
    image: pond-planning-backend:latest
    container_name: pond-backend
    restart: unless-stopped
    environment:
      APP_PORT: "3000"
      # db-server is a sibling container on the same compose network —
      # reached by its service name, not localhost or any global URL.
      DB_SERVER_BASE_URL: "http://db-server:4000"
    ports:
      - "${LOCAL_BACKEND_PORT}:3000"
    networks:
      - pond-net
    depends_on:
      db-server:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  db-server:
    build: *backend-build
    image: pond-planning-backend:latest
    container_name: pond-db-server
    restart: unless-stopped
    command: ["python", "app/db_server.py"]
    environment:
      APP_PORT: "4000"
      DB_SERVER_PORT: "4000"
      SQLITE_DB_PATH: "/data/pond_runs.db"
    volumes:
      - db-data:/data
    ports:
      - "${LOCAL_DB_PORT}:4000"
    networks:
      - pond-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  pond-net:
    driver: bridge

volumes:
  db-data:
    driver: local
