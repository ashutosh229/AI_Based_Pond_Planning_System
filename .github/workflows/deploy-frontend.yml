name: Deploy Frontend to Remote System

on:
  push:
    branches: [main]
    paths: ["frontend/**", "scripts/remote_deploy_frontend.sh"]
  workflow_dispatch: {}

jobs:
  build-then-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build (deploy gate)
        working-directory: frontend
        env:
          VITE_API_BASE_URL: "http://10.1.75.79:3205"
        run: |
          npm ci
          npm run build

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FRONTEND_SSH_HOST }}
          port: ${{ secrets.FRONTEND_SSH_PORT }}
          username: ${{ secrets.FRONTEND_SSH_USER }}
          key: ${{ secrets.FRONTEND_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            bash "${{ secrets.FRONTEND_REMOTE_APP_DIR }}/scripts/remote_deploy_frontend.sh" "${{ secrets.FRONTEND_REMOTE_APP_DIR }}"
