name: Docker Image Build Check

on:
  pull_request:
    paths: ["backend/**", "docker-compose.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "docker-compose.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (build-only, not pushed or run)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: pond-planning-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
