name: Deploy Backend to Remote System

on:
  push:
    branches: [main]
    paths: ["backend/**", "scripts/remote_deploy.sh"]
  workflow_dispatch: {} # manual "Run workflow" button for on-demand redeploys

jobs:
  test-then-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test backend (deploy gate)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest tests/ -v

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            bash "${{ secrets.REMOTE_APP_DIR }}/scripts/remote_deploy.sh" "${{ secrets.REMOTE_APP_DIR }}"
